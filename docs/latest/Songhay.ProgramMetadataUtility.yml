  assemblies:
  - SonghayCore
  namespace: Songhay
  summary: >-
    Returns a JSON string or <code>null</code>

    based on the presence of one of two conventional environment variables.
  remarks: >-
    Of the two expected environment variables,

    The one with the <code>_PATH</code> suffix should lead to JSON of the form:


    <pre><code class="lang-csharp">{
        "ProgramMetadata": { … }
    }</code></pre>


    …which conforms to <xref href="Microsoft.Extensions.Configuration.IConfiguration" data-throw-if-not-resolved="false"></xref> conventions.
  example: []
  syntax:
    content: public static string? GetJsonForProgramMetadataFromEnvironment()
    return:
      type: System.String
    content.vb: Public Shared Function GetJsonForProgramMetadataFromEnvironment() As String
  overload: Songhay.ProgramMetadataUtility.GetJsonForProgramMetadataFromEnvironment*
