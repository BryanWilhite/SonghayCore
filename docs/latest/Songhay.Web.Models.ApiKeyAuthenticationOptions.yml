  source:
    remote:
      path: SonghayCore.Web/Models/ApiKeyAuthenticationOptions.cs
      branch: main
      repo: git@github.com:BryanWilhite/SonghayCore.git
    id: HeaderName
    path: ../SonghayCore.Web/Models/ApiKeyAuthenticationOptions.cs
    startLine: 48
  assemblies:
  - SonghayCore.Web
  namespace: Songhay.Web.Models
  summary: The conventional HTTP header name for API-key authentication.
  remarks: >-
    <p>

    “The de-facto header name is X-API-Key.

    It is not a formal HTTP standard - the X- prefix

    was actually deprecated by RFC 6648 -

    but it has become the convention because

    of widespread adoption

    (AWS API Gateway, GitHub before tokens, most webhook providers).

    Some APIs use the Authorization header

    with a custom scheme like Authorization: ApiKey <code>{key}</code>.

    Both work; pick one and stick with it.”

    </p>

    <p>

    — Mukesh Murugan, [ https://codewithmukesh.com/blog/api-key-authentication-aspnet-core/ ]

    </p>
  example: []
  syntax:
    content: public const string HeaderName = "X-API-Key"
    return:
      type: System.String
    content.vb: Public Const HeaderName As String = "X-API-Key"
