    id: ToS3LessSecureTuple
    path: ../SonghayCore.S3/Extensions/RestApiMetadataExtensions.cs
    startLine: 36
  assemblies:
  - SonghayCore.S3
  namespace: Songhay.S3.Extensions
  summary: >-
    Returns a tuple, decomposing the specified <xref href="Songhay.Models.RestApiMetadata" data-throw-if-not-resolved="false"></xref>

    into:


    - the S3 ‘public’ key (<code>AWS_ACCESS_KEY_ID</code>)

    - the S3 ‘private’ key (<code>AWS_SECRET_ACCESS_KEY</code>)

    - the S3 bucket name

    - the S3 bucket region

    - the base URI of the bucket
  remarks: >-
    This transformation is called ‘less secure’

    because the S3 ‘public’/‘private’ keys are exposed

    to the developer/consumer explicitly

    which encourages security risks.


    Surely, Amazon recommends using the <xref href="Amazon.Runtime.CredentialManagement.CredentialProfileStoreChain" data-throw-if-not-resolved="false"></xref>

    which can lead to leveraging an “underlying orchestration layer” (e.g. a layer with EKS Pod Identity)

    instead of handling secrets explicitly.


    To use the <xref href="Songhay.Models.ProgramMetadata" data-throw-if-not-resolved="false"></xref> convention of this Studio

    without handling secrets explicitly, use <xref href="Songhay.S3.Extensions.RestApiMetadataExtensions.ToS3Tuple(Songhay.Models.RestApiMetadata%2cSystem.String%2cMicrosoft.Extensions.Logging.ILogger)" data-throw-if-not-resolved="false"></xref> instead.


    See the remarks for <xref href="Songhay.S3.Extensions.RestApiMetadataExtensions.ToS3Tuple(Songhay.Models.RestApiMetadata%2cSystem.String%2cMicrosoft.Extensions.Logging.ILogger)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static (string? publicKey, string? privateKey, string? bucketName, string? region, string? uriRoot) ToS3LessSecureTuple(this RestApiMetadata? meta, string? bucketMetaKey, ILogger logger)
    parameters:
    - id: meta
      type: Songhay.Models.RestApiMetadata
      description: the <xref href="Songhay.Models.RestApiMetadata" data-throw-if-not-resolved="false"></xref>
    - id: bucketMetaKey
      type: System.String
      description: the <xref href="Songhay.Models.RestApiMetadata.ClaimsSet" data-throw-if-not-resolved="false"></xref> dictionary key
    - id: logger
      type: Microsoft.Extensions.Logging.ILogger
      description: the <xref href="Microsoft.Extensions.Logging.ILogger" data-throw-if-not-resolved="false"></xref>
    return:
      type: System.ValueTuple{System.String,System.String,System.String,System.String,System.String}
    content.vb: Public Shared Function ToS3LessSecureTuple(meta As RestApiMetadata, bucketMetaKey As String, logger As ILogger) As (publicKey As String, privateKey As String, bucketName As String, region As String, uriRoot As String)
  overload: Songhay.S3.Extensions.RestApiMetadataExtensions.ToS3LessSecureTuple*
