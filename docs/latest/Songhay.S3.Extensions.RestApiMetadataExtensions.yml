  type: Method
  source:
    remote:
      path: SonghayCore.S3/Extensions/RestApiMetadataExtensions.cs
      branch: main
      repo: git@github.com:BryanWilhite/SonghayCore.git
    id: ToS3Tuple
    path: ../SonghayCore.S3/Extensions/RestApiMetadataExtensions.cs
    startLine: 104
  assemblies:
  - SonghayCore.S3
  namespace: Songhay.S3.Extensions
  summary: >-
    Returns a tuple, decomposing the specified <xref href="Songhay.Models.RestApiMetadata" data-throw-if-not-resolved="false"></xref>

    into:


    - AWS credentials profile name (on Linux in the <code>~/.aws/credentials</code> file)

    - the S3 bucket name

    - the S3 bucket region

    - the base URI of the bucket
  remarks: >-
    The JSON shaped like <xref href="Songhay.Models.RestApiMetadata" data-throw-if-not-resolved="false"></xref> can look like this:


    <pre><code class="lang-csharp">"Wasabi": {
        "ClaimsSet": {
            "aws-credentials-profile-name": "???",
            "bucket-region-suffix": "-region",
            "public-key": "???",
            "private-key": "??",
            "bucket-location-template": "https://s3.{Region}.wasabisys.com/",
            "bucket-location-template-placeholder": "{Region}",
            "my-bucket-region": "us-central-1"
        }
    }</code></pre>


    …where the name of the bucket, <code>my-bucket</code>, is ‘embedded’

    in the <code>my-bucket-region</code> key-value pair.
  example: []
  syntax:
    content: public static (string? credentialsProfileName, string? bucketName, string? region, string? uriRoot) ToS3Tuple(this RestApiMetadata? meta, string? bucketMetaKey, ILogger logger)
    parameters:
    - id: meta
      type: Songhay.Models.RestApiMetadata
      description: the <xref href="Songhay.Models.RestApiMetadata" data-throw-if-not-resolved="false"></xref>
    - id: bucketMetaKey
      type: System.String
      description: the <xref href="Songhay.Models.RestApiMetadata.ClaimsSet" data-throw-if-not-resolved="false"></xref> dictionary key
    - id: logger
      type: Microsoft.Extensions.Logging.ILogger
      description: the <xref href="Microsoft.Extensions.Logging.ILogger" data-throw-if-not-resolved="false"></xref>
    return:
      type: System.ValueTuple{System.String,System.String,System.String,System.String}
    content.vb: Public Shared Function ToS3Tuple(meta As RestApiMetadata, bucketMetaKey As String, logger As ILogger) As (credentialsProfileName As String, bucketName As String, region As String, uriRoot As String)
  overload: Songhay.S3.Extensions.RestApiMetadataExtensions.ToS3Tuple*
  nameWithType.vb: RestApiMetadataExtensions.ToS3Tuple(RestApiMetadata, String, ILogger)
  fullName.vb: Songhay.S3.Extensions.RestApiMetadataExtensions.ToS3Tuple(Songhay.Models.RestApiMetadata, String, Microsoft.Extensions.Logging.ILogger)
  name.vb: ToS3Tuple(RestApiMetadata, String, ILogger)
