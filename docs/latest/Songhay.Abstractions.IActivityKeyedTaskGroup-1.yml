  assemblies:
  - SonghayCore
  namespace: Songhay.Abstractions
  summary: A lightweight façade in front of many <code>IActivity*</code> implementations.
  remarks: >-
    <p>

    Consider using the conventional Result types

    like <xref href="Songhay.Models.ProgramOutputResult%601" data-throw-if-not-resolved="false"></xref>

    or <xref href="Songhay.Models.EndpointContentResult%601" data-throw-if-not-resolved="false"></xref>

    for <code>TOutput</code>.

    </p>


    <p>

    This abstraction uses the word <code>Keyed</code>

    to indicate that the many <code>IActivity*</code> implementations

    are identified by magic strings to avoid exposing class definitions

    to downstream consumers.

    </p>


    <p>

    To avoid magic strings, consider implementing <xref href="Songhay.Abstractions.IActivityTaskGroup%601" data-throw-if-not-resolved="false"></xref> instead.

    </p>
