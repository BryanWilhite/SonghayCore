  namespace: Songhay.Abstractions
  summary: >-
    Invokes the <code>IActivity*</code> implementation

    identified by the specified key.
  remarks: >-
    Note that <code>TOutput</code> is not marked as nullable

    with the expectation that <code>*Result</code> classes/records

    like <xref href="Songhay.Models.EndpointResult" data-throw-if-not-resolved="false"></xref> will be used.
  example: []
  syntax:
    content: 'Task<TOutput> InvokeActivityAsync<TActivity>(CancellationToken cancellationToken, params string?[] args) where TActivity : class'
    parameters:
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: the <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>
    - id: args
      type: System.String[]
      description: collects the stringified input arguments of the <code>IActivity*</code> implementation
    typeParameters:
    - id: TActivity
      description: identifies the <code>IActivity*</code> implementation
    return:
      type: System.Threading.Tasks.Task{{TOutput}}
    content.vb: Function InvokeActivityAsync(Of TActivity As Class)(cancellationToken As CancellationToken, ParamArray args As String()) As Task(Of TOutput)
