  assemblies:
  - SonghayCore
  namespace: Songhay.Abstractions
  summary: A lightweight façade in front of many <code>IActivity*</code> implementations.
  remarks: >-
    <p>

    Consider using the conventional Result types

    like <xref href="Songhay.Models.ProgramOutputResult%601" data-throw-if-not-resolved="false"></xref>

    or <xref href="Songhay.Models.EndpointContentResult%601" data-throw-if-not-resolved="false"></xref>

    for <code>TOutput</code>.

    </p>

    <p>

    This abstraction exposes class definitions to consumers with its <code>TActivity</code> type parameter.

    To avoid this exposure (coupling), consider implementing <xref href="Songhay.Abstractions.IActivityKeyedTaskGroup%601" data-throw-if-not-resolved="false"></xref> instead.

    </p>
  example: []
  syntax:
    content: 'public interface IActivityTaskGroup<TOutput> where TOutput : notnull'
    typeParameters:
    - id: TOutput
      description: a non-nullable value or reference type
    content.vb: Public Interface IActivityTaskGroup(Of TOutput)
